name: Validación continua

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Probar API y auditar/compilar frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas API
        run: npm test

      - name: Auditar estructura frontend
        run: npm run audit -w @idealo-sv/web

      - name: Compilar frontend
        run: npm run build
