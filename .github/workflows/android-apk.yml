name: Generar APK Android

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_ANDROID_BUILD_SHA: ${{ github.sha }}
      ANDROID_SIGNING_READY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validar configuración pública Android
        shell: bash
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Falta VITE_SUPABASE_URL en GitHub Actions"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Falta VITE_SUPABASE_ANON_KEY en GitHub Actions"; exit 1; }

      - name: Instalar dependencias
        run: npm install

      - name: Regresión móvil automática
        run: npm --workspace apps/web run mobile:regression

      - name: Compilar frontend
        run: npm --workspace apps/web run build

      - name: Crear proyecto Android
        working-directory: apps/web
        run: npx cap add android

      - name: Sincronizar Capacitor
        working-directory: apps/web
        run: npx cap sync android

      - name: Declarar permisos nativos Android
        working-directory: apps/web
        run: node scripts/patch-native-mobile-permissions.mjs android

      - name: Verificar permisos Android
        working-directory: apps/web
        shell: bash
        run: |
          grep -q 'android.permission.CAMERA' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_FINE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.ACCESS_COARSE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml

      - name: Aplicar icono nativo IDEALO SV
        working-directory: apps/web
        shell: bash
        run: |
          for dir in android/app/src/main/res/mipmap-anydpi android/app/src/main/res/mipmap-anydpi-v26; do
            mkdir -p "$dir"
            cat > "$dir/ic_launcher.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#F36C21" android:pathData="M0,0H108V108H0Z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M50,26C47.8,26 46,27.8 46,30V78C46,80.2 47.8,82 50,82H58C60.2,82 62,80.2 62,78V30C62,27.8 60.2,26 58,26Z"/>
          </vector>
          EOF
            cp "$dir/ic_launcher.xml" "$dir/ic_launcher_round.xml"
          done

      - name: Preparar firma Android release
        if: env.ANDROID_SIGNING_READY == 'true'
        working-directory: apps/web
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          IDEALO_ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/apps/web/android/app/idealo-release.jks
          IDEALO_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          IDEALO_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IDEALO_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/idealo-release.jks
          node scripts/patch-android-release-signing.mjs
          keytool -list -keystore android/app/idealo-release.jks -storepass "$IDEALO_ANDROID_KEYSTORE_PASSWORD" -alias "$IDEALO_ANDROID_KEY_ALIAS" >/dev/null

      - name: Avisar si AAB aún no tiene firma de tienda
        if: env.ANDROID_SIGNING_READY != 'true'
        run: echo "AAB compilable, pero faltan secretos de firma de Google Play. El APK debug seguirá disponible para pruebas físicas."

      - name: Compilar APK debug y AAB release
        working-directory: apps/web/android
        run: |
          ./gradlew assembleDebug
          ./gradlew bundleRelease

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: idealo-sv-android-debug
          path: apps/web/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar AAB firmado de release
        if: env.ANDROID_SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idealo-sv-android-release-signed
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publicar AAB no firmado de validación
        if: env.ANDROID_SIGNING_READY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: idealo-sv-android-release-unsigned
          path: apps/web/android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Publicar actualización Android más reciente
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest \
            apps/web/android/app/build/outputs/apk/debug/app-debug.apk#IDEALO-SV-Android.apk \
            --target "$GITHUB_SHA" \
            --title "IDEALO SV Android ${GITHUB_SHA::7}" \
            --notes "build_sha=${GITHUB_SHA}; signing_ready=${ANDROID_SIGNING_READY}"
