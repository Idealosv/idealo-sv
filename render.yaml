services:
  - type: web
    name: idealo-sv-signer
    runtime: docker
    plan: free
    dockerfilePath: ./apps/signer/Dockerfile
    dockerContext: ./apps/signer
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: nonssl
      - key: CERTIFICATE_HOME
        value: /tmp/certificates
      - key: SIGNER_API_TOKEN
        sync: false

  - type: web
    name: idealo-sv-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start -w @idealo-sv/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DTE_ENVIRONMENT
        value: test
      - key: DTE_ENABLE_PRODUCTION
        value: false
      - key: DTE_MH_NIT
        sync: false
      - key: DTE_MH_API_PASSWORD
        sync: false
      - key: DTE_SIGNER_URL
        sync: false
      - key: DTE_SIGNER_TOKEN
        sync: false
      - key: DTE_SIGNER_PASSWORD
        sync: false
      - key: DTE_REQUEST_TIMEOUT_MS
        value: 8000
      - key: DTE_MAX_RESENDS
        value: 2

  - type: web
    name: idealo-sv-web
    runtime: static
    buildCommand: npm install && npm run build -w @idealo-sv/web
    staticPublishPath: ./apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_API_URL
        sync: false
